version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klovy-chat-backend
    restart: always
    env_file:
      - .env
    network_mode: "host"  # Umożliwia łatwy dostęp do bazy i tunelu na VPS

  clamav:
    image: clamav/clamav:1.4
    container_name: klovy-chat-clamav
    restart: unless-stopped
    # Only localhost — clamd INSTREAM has no auth. Backend (host network):
    # CLAMAV_HOST=127.0.0.1:3310
    ports:
      - "127.0.0.1:3310:3310"
    security_opt:
      - no-new-privileges:true
    # Start: docker compose --profile scan up -d
    profiles:
      - scan
