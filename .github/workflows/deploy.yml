    - name: Deploy backend
      run: |

        ssh \
          -i ~/.ssh/id_ed25519 \
          -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

        set -euo pipefail

        APP_DIR="/opt/klovy/backend"
        APP="$APP_DIR/klovychat"
        NEW="/tmp/klovychat.new"
        BACKUP="$APP_DIR/klovychat.backup.$(date +%Y%m%d_%H%M%S)"

        echo "=== Checking uploaded file ==="

        test -f "$NEW"

        echo "=== Backup current binary ==="

        cp "$APP" "$BACKUP"

        echo "Backup created:"
        echo "$BACKUP"

        echo "=== Stopping service ==="

        sudo /usr/bin/systemctl stop klovychat

        echo "=== Installing new binary ==="

        install -m755 "$NEW" "$APP"

        echo "=== Starting service ==="

        sudo /usr/bin/systemctl start klovychat

        echo "Waiting..."

        sleep 5

        echo "=== Checking service ==="

        if ! sudo /usr/bin/systemctl is-active --quiet klovychat
        then

            echo "SERVICE FAILED"

            echo "=== Rollback ==="

            sudo /usr/bin/systemctl stop klovychat

            install -m755 "$BACKUP" "$APP"

            sudo /usr/bin/systemctl start klovychat

            sleep 5

            if ! sudo /usr/bin/systemctl is-active --quiet klovychat
            then
                echo "ROLLBACK FAILED"
                exit 1
            fi

            echo "Rollback successful"
            exit 1

        fi

        echo "=== Service running ==="

        sudo /usr/bin/systemctl status klovychat --no-pager

        echo "=== Last logs ==="

        sudo journalctl \
          -u klovychat \
          -n 20 \
          --no-pager

        echo "DEPLOY SUCCESS"

        EOF