name: Deploy KlovyChat Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      migration:
        description: "Message content migration (after deploy)"
        type: choice
        options:
          - skip
          - dry-run
          - apply
        default: skip

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust backend
        run: cargo build --release

      - name: Verify binaries
        run: |
          ls -lh target/release/
          test -f target/release/klovy-chat-serv
          test -f target/release/migrate-message-content-seal
          echo "Binaries OK"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "whoami && echo SSH_OK"

      - name: Upload binaries
        run: |
          rsync \
            -avz \
            --timeout=30 \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            target/release/klovy-chat-serv \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/klovy-chat-server.new

          rsync \
            -avz \
            --timeout=30 \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            target/release/migrate-message-content-seal \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/migrate-message-content-seal.new

      - name: Deploy backend
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          set -euo pipefail

          APP_DIR="/home/dupa/backend"
          APP="$APP_DIR/klovy-chat-server"
          MIGRATE="$APP_DIR/migrate-message-content-seal"
          NEW="/tmp/klovy-chat-server.new"
          MIGRATE_NEW="/tmp/migrate-message-content-seal.new"
          BACKUP="$APP_DIR/klovy-chat-server.backup.$(date +%Y%m%d_%H%M%S)"

          echo "=== Check new binaries ==="
          if [ ! -f "$NEW" ]; then
              echo "Missing uploaded klovy-chat-server binary"
              exit 1
          fi

          if [ ! -f "$MIGRATE_NEW" ]; then
              echo "Missing uploaded migration binary"
              exit 1
          fi

          echo "=== Install migration binary ==="
          install -m755 "$MIGRATE_NEW" "$MIGRATE"

          echo "=== Backup current binary ==="
          if [ -f "$APP" ]; then
              cp "$APP" "$BACKUP"
              echo "Backup created: $BACKUP"
          fi

          echo "=== Stop service ==="
          sudo /usr/bin/systemctl stop rust-backend.service

          echo "=== Replace binary ==="
          install -m755 "$NEW" "$APP"

          echo "=== Start service ==="
          sudo /usr/bin/systemctl start rust-backend.service

          echo "Waiting..."
          sleep 5

          echo "=== Health check ==="
          if ! sudo /usr/bin/systemctl is-active --quiet rust-backend.service; then
              echo "SERVICE FAILED"
              echo "=== Rollback ==="
              sudo /usr/bin/systemctl stop rust-backend.service
              if [ -f "$BACKUP" ]; then
                  install -m755 "$BACKUP" "$APP"
                  sudo /usr/bin/systemctl start rust-backend.service
                  sleep 5
              fi

              if ! sudo /usr/bin/systemctl is-active --quiet rust-backend.service; then
                  echo "ROLLBACK FAILED"
                  exit 1
              fi

              echo "Rollback OK"
              exit 1
          fi

          echo "=== Service running ==="
          sudo /usr/bin/systemctl status rust-backend.service --no-pager

          echo "=== Logs ==="
          sudo journalctl -u rust-backend.service -n 20 --no-pager

          echo "DEPLOY SUCCESS"
          EOF

      - name: Run message content migration (dry-run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.migration == 'dry-run'
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          set -euo pipefail

          APP_DIR="/home/dupa/backend"
          MIGRATE="$APP_DIR/migrate-message-content-seal"

          echo "=== Message content migration (dry-run) ==="
          cd "$APP_DIR"
          "$MIGRATE" --dry-run

          echo "MIGRATION DRY-RUN SUCCESS"
          EOF

      - name: Run message content migration (apply)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.migration == 'apply'
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          set -euo pipefail

          APP_DIR="/home/dupa/backend"
          MIGRATE="$APP_DIR/migrate-message-content-seal"

          echo "=== Message content migration (apply) ==="
          cd "$APP_DIR"
          "$MIGRATE" --apply

          echo "MIGRATION APPLY SUCCESS"
          EOF