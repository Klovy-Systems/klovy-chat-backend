name: Deploy KlovyChat Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable


    - name: Build Rust backend
      run: |
        cargo build --release


    - name: Setup SSH
      run: |

        mkdir -p ~/.ssh

        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519

        chmod 600 ~/.ssh/id_ed25519

        ssh-keyscan \
          -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts



    - name: Test SSH connection
      run: |

        ssh \
          -i ~/.ssh/id_ed25519 \
          -p ${{ secrets.SSH_PORT }} \
          -o StrictHostKeyChecking=yes \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "whoami && echo SSH_OK"



    - name: Upload binary
      run: |

        rsync \
          -avz \
          --timeout=30 \
          -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
          target/release/klovychat \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/klovychat.new



    - name: Deploy backend
      run: |

        ssh \
          -i ~/.ssh/id_ed25519 \
          -p ${{ secrets.SSH_PORT }} \
          -o StrictHostKeyChecking=yes \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'


        set -euo pipefail


        APP_DIR="/opt/klovy/backend"

        APP="$APP_DIR/klovychat"

        NEW="/tmp/klovychat.new"

        BACKUP="$APP_DIR/klovychat.backup.$(date +%Y%m%d_%H%M%S)"



        echo "=== Checking files ==="


        if [ ! -f "$NEW" ]; then

            echo "New binary missing!"

            exit 1

        fi



        if [ ! -f "$APP" ]; then

            echo "Current binary missing!"

            exit 1

        fi



        echo "=== Backup current binary ==="


        cp "$APP" "$BACKUP"



        echo "Backup created:"
        echo "$BACKUP"



        echo "=== Installing new binary ==="


        install \
          -m755 \
          "$NEW" \
          "$APP"



        echo "=== Restarting service ==="


        sudo systemctl restart klovychat



        echo "=== Waiting for startup ==="


        sleep 5



        echo "=== Health check ==="


        if ! sudo systemctl is-active --quiet klovychat

        then

            echo "Service failed!"

            echo "=== Rollback ==="


            cp "$BACKUP" "$APP"


            sudo systemctl restart klovychat


            sleep 5



            if ! sudo systemctl is-active --quiet klovychat

            then

                echo "Rollback failed!"

                exit 1

            fi


            echo "Rollback successful"


            exit 1

        fi



        echo "=== Deploy successful ==="


        sudo systemctl status klovychat --no-pager || true


        EOF