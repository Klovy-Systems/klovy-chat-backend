name: Deploy KlovyChat Backend via Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        run: |
          rsync -avz --timeout=30 \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude target \
            --exclude .git \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/dupa/backend/

      - name: Build & Run Docker Container
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -euo pipefail

          cd /home/dupa/backend

          echo "=== Stop old systemd service ==="
          sudo systemctl stop rust-backend.service || true
          sudo systemctl disable rust-backend.service || true

          echo "=== Building Docker Image & Starting Container ==="
          docker compose up -d --build

          echo "=== Docker Status ==="
          docker compose ps

          echo "=== Logs ==="
          docker compose logs --tail=20

          echo "DEPLOY SUCCESS"
          EOF